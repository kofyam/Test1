<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>טעינת נתונים</title>
<style>
  body{margin:0;padding:24px 16px;font:16px system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:#fff;color:#0F1A2E}
  main{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#5A6578;margin:0 0 16px;line-height:1.5}
  label{display:block;font-weight:600;margin-bottom:6px}
  input{width:100%;box-sizing:border-box;padding:10px;font:inherit;border:1px solid #C9D3E3;border-radius:8px;margin-bottom:12px}
  button{padding:10px 18px;font:inherit;font-weight:600;border:0;border-radius:8px;background:#00234F;color:#fff;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #log{white-space:pre-wrap;background:#F3F6FA;border-radius:8px;padding:12px;margin-top:16px;font:13px ui-monospace,Consolas,monospace;direction:ltr;text-align:left}
  #log:empty{display:none}
  .err{color:#B3261E}.ok{color:#1E6B34}
</style>
</head>
<body>
<main>
  <h1>טעינת הנתונים מהגיבוי</h1>
  <p>דף חד-פעמי: טוען לבסיס הנתונים ב-Firebase את התפריטים, העובדים, ההזמנות וטבלת המעקב מהגיבוי של האתר הקודם. רק המנהל/ת יכול/ה להריץ אותו.</p>
  <form id="f">
    <label for="pw">סיסמת המנהל</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">כניסה וטעינה</button>
  </form>
  <div id="log"></div>
</main>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="seed-data.js"></script>
<script>
(function () {
  'use strict';
  var logEl = document.getElementById('log'), btn = document.getElementById('go');
  function log(msg, cls) { var d = document.createElement('div'); d.textContent = msg; if (cls) d.className = cls; logEl.appendChild(d); }

  if (!window.FIREBASE_CONFIG || !window.ADMIN_EMAIL) { btn.disabled = true; log('firebase-config.js is not filled in yet.', 'err'); return; }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  var db = firebase.firestore(), auth = firebase.auth();

  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    btn.disabled = true; logEl.textContent = '';
    try {
      await auth.signInWithEmailAndPassword(window.ADMIN_EMAIL, document.getElementById('pw').value);
      log('Signed in as ' + window.ADMIN_EMAIL, 'ok');

      var cur = await db.doc('config/current').get();
      if (cur.exists && !confirm('יש כבר נתונים באתר. לדרוס אותם בנתונים מהגיבוי?')) { log('Cancelled. Nothing was changed.'); btn.disabled = false; return; }

      var paths = Object.keys(window.SEED_DATA || {}), batch = db.batch();
      paths.forEach(function (p) { batch.set(db.doc(p), window.SEED_DATA[p]); });
      await batch.commit();
      paths.forEach(function (p) { log('✓ ' + p); });
      log('Done: ' + paths.length + ' documents loaded. You can close this page.', 'ok');
    } catch (err) {
      log('Failed: ' + (err && (err.code || err.message) || err), 'err');
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
